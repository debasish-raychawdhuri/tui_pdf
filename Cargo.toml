[package]
name = "tui_pdf"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "tui_pdf"
path = "src/lib.rs"

[[bin]]
name = "tui-pdf"
path = "src/main.rs"

[profile.dev.package."*"]
opt-level = 2

[dependencies]
mupdf = "0.6"
ratatui = { version = "0.30.1", features = ["crossterm"] }
ratatui-image = { version = "11", features = ["crossterm"] }
crossterm = "0.29"
image = "0.25"
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
headless_chrome = "1"
base64 = "0.22"
serde_json = "1"
flate2 = "1"
comrak = "0.52"
printpdf = { version = "0.9", default-features = false, features = ["images", "png"] }
ratex-render = { version = "0.1", features = ["embed-fonts"] }
ratex-layout = "0.1"
ratex-parser = "0.1"
ratex-types = "0.1"
ttf-parser = "0.25"
# pure-Rust regex backend (fancy-regex) so we don't pull in the C `onig` lib;
# keeps default syntaxes + themes for code-block highlighting.
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
